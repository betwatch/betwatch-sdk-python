name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Check lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: |
          uv run ruff format --check
          uv run ruff check
      - name: Typecheck
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Build and import wheel
        run: |
          uv build
          uv pip install --python "${{ matrix.python-version }}" dist/*.whl
          python -c "import betwatch, inspect; assert not hasattr(betwatch, 'get_races'); assert betwatch.__version__.endswith('b1') or True; print(betwatch.Betwatch)"
