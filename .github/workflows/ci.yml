name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Check lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: |
          uv run ruff format --check
          uv run ruff check
      - name: Typecheck
        run: uv run ty check
      - name: Tests
        run: uv run pytest
      - name: Build and import wheel
        run: |
          uv build
          # Install into the interpreter `python` actually resolves to. Passing
          # a bare version lets uv pick a different 3.x than setup-python put on
          # PATH, and the import below then runs somewhere the wheel is not.
          uv pip install --python "$(which python)" dist/*.whl
          python - <<'EOF'
          import betwatch
          from importlib.metadata import version

          assert not hasattr(betwatch, "get_races"), "GraphQL 1.x surface leaked into the wheel"
          assert betwatch.__version__ == version("betwatch"), betwatch.__version__
          # the public surface a consumer actually imports
          for name in ("Betwatch", "AsyncBetwatch", "ErrorCodes", "QuotaExceededError"):
              assert hasattr(betwatch, name), name
          print(betwatch.Betwatch, betwatch.__version__)
          EOF
