name: Publish

permissions:
  contents: read
  id-token: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.0.0b1)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Check tag matches package version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          VERSION=$(python -c "import ast, pathlib; t=pathlib.Path('src/betwatch/__about__.py').read_text(); print(ast.literal_eval(next(l.split('=',1)[1] for l in t.splitlines() if l.startswith('__version__')).strip()))")
          test "$TAG" = "$VERSION"
      - name: Test
        run: |
          uv sync --frozen --all-groups
          uv run pytest
          uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
