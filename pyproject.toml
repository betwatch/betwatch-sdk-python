[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betwatch"
dynamic = ["version"]
description = "Public /v2 REST + SSE client for the Betwatch racing odds API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["betwatch", "betting", "racing", "odds", "sse"]
authors = [{ name = "Jamie Watts", email = "jamie@betwatch.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "msgspec>=0.19",
]

[project.urls]
Documentation = "https://github.com/betwatch/betwatch-sdk-python#readme"
Issues = "https://github.com/betwatch/betwatch-sdk-python/issues"
Source = "https://github.com/betwatch/betwatch-sdk-python"
"Betwatch.com" = "https://betwatch.com"

[project.optional-dependencies]
pandas = ["pandas>=2.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.1",
    "git-cliff>=2.7.0",
    "textual>=3.0",
    "pyright>=1.1.411",
]

[tool.hatch.version]
path = "src/betwatch/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/betwatch"]

[tool.hatch.build.targets.sdist]
include = ["src/betwatch", "tests", "examples", "README.md", "AGENTS.md", "CONTRIBUTING.md", "CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["betwatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "examples"]

[tool.ty.src]
include = ["src/betwatch", "tests"]
exclude = ["tests/typing/status_bad.py", "tests/typing/status_eq_bad.py", "tests/typing/scope_bad.py"]

[tool.pyright]
include = ["src/betwatch"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportUnnecessaryComparison = "error"

# Changelog and release notes come from conventional commits. `tools/release.sh`
# prepends CHANGELOG.md; the Publish workflow renders the same section as the
# GitHub release notes.
[tool.git-cliff.changelog]
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/betwatch/betwatch-sdk-python/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/betwatch/betwatch-sdk-python/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactors" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^(build|ci)", group = "<!-- 5 -->Build and CI" },
    { message = "^(chore|style|test)", skip = true },
]
